# Netlify settings for the shop's FRONTEND (the Vue app). Netlify cannot run the Laravel API or the database; those live elsewhere
# (see docs/hosting-free.md). This file tells Netlify how to build the frontend, and forwards API calls to the API.

[build]
  base = "frontend"        # the Vue app lives in this folder
  command = "npm run build"
  publish = "dist"         # relative to "base"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------------------------------------------------------
# Headers that tell the browser what these pages may do. They apply to the pages and files Netlify serves itself; answers
# forwarded from the API carry the API's own headers (backend/app/Http/Middleware/SecurityHeaders.php).
#
# Content-Security-Policy is a list of the ONLY places each kind of thing may come from. If an attacker ever managed to slip a
# <script> into a page, the browser would refuse to run it, because scripts may only come from this site's own files.
#   script-src 'self'            scripts: only this site's own files (no inline scripts, no other sites)
#   style-src ... googleapis     stylesheets: this site, and Google Fonts (no inline styles are needed: Vue sets them from code)
#   font-src ... gstatic         the font files those stylesheets point to
#   img-src ... https:           pictures: this site, and the photo bucket (any https address, so the storage company can change)
#   connect-src 'self'           the app may call only this site's own /api
#   frame-ancestors 'none'       no other site may show the shop inside a frame (clickjacking)
# ---------------------------------------------------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Built files have a fingerprint in their name (index-uhmPCzrt.js) that changes whenever their content does, so a browser may
# keep them for a year. The page itself (index.html) is never cached this way, so a new deploy is picked up at once.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------------------------------------------------------
# Forward API calls to the API server, so the browser only ever talks to THIS site (same address = login cookies just work,
# exactly as with the Vite dev server on your own computer). "status = 200" makes it a forward, not a redirect.
#
# >>> BEFORE YOUR FIRST DEPLOY: replace YOUR-API-NAME.onrender.com (three times) with the address of your API. <<<
#
# The order matters: Netlify uses the first rule that matches, so these come BEFORE the catch-all at the bottom.
# ---------------------------------------------------------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-API-NAME.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sanctum/*"
  to = "https://YOUR-API-NAME.onrender.com/sanctum/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/storage/*"
  to = "https://YOUR-API-NAME.onrender.com/storage/:splat"
  status = 200
  force = true

# Everything else is a page of the Vue app (it draws its own pages in the browser), so always send the app itself.
# Without this, refreshing the page on /orders or /admin/products would show "Page not found".
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
