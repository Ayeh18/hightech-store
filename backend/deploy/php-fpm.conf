; A few PHP workers is plenty for a small free server (and keeps memory use low).
[www]
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Let PHP see the host's environment variables (APP_KEY, DB_URL...). By default PHP-FPM hides them.
clear_env = no
