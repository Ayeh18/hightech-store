; PHP settings for a small server.
memory_limit = 128M
upload_max_filesize = 4M
post_max_size = 6M
expose_php = Off
date.timezone = UTC

; The code inside the image never changes while it runs, so PHP can skip checking files for changes.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
